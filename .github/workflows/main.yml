name: Windows-CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Set up Python dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "🐍 Setting up Python..." -ForegroundColor Green

          python --version
          python -m pip --version

          python -m pip install --upgrade pip
          python -m pip install --upgrade `
            requests `
            pyautogui `
            telegraph `
            Pillow `
            PyScreeze

      - name: Verify PyAutoGUI
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "🔍 Testing PyAutoGUI dependencies..." -ForegroundColor Yellow

          python -c "import PIL; print('Pillow:', PIL.__version__)"
          python -c "import pyscreeze; print('PyScreeze OK')"
          python -c "import pyautogui; print('PyAutoGUI OK')"

      - name: Run Python script
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          python setup.py

          if ($LASTEXITCODE -ne 0) {
              Write-Host "❌ setup.py failed with exit code $LASTEXITCODE" -ForegroundColor Red
              exit $LASTEXITCODE
          }

          Write-Host "✅ setup.py completed successfully" -ForegroundColor Green
